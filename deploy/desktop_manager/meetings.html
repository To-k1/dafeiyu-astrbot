<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>组会会场 · FishHome</title>
<style>
:root{color-scheme:dark;--bg:#0a111b;--panel:#131e2b;--wash:#192736;--line:#344252;--ink:#eaf0f7;--muted:#a6b5c6;--accent:#f4cb69;--signal-ink:#17180f}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel);border-bottom:1px solid var(--line);padding:12px clamp(14px,4vw,42px)}
.top a{color:var(--ink);text-underline-offset:4px}.top span{font-weight:650}.top span,.muted,small,time{color:var(--muted)}
main{width:min(1400px,100%);margin:auto;padding:clamp(14px,3vw,34px);display:grid;grid-template-columns:minmax(0,1fr) minmax(175px,235px);gap:28px;min-height:100dvh}
h1,h2,h3,p{margin:0}h1{font-size:clamp(26px,3.4vw,44px);line-height:1.2;letter-spacing:-.02em;overflow-wrap:anywhere}
h2{font-size:16px}h3{font-size:13px;color:var(--muted)}section,aside{min-width:0}
aside{align-self:start;border-top:1px solid #526173;padding-top:10px}
button,select,textarea{font:inherit;color:var(--ink);background:var(--wash);border:1px solid var(--line);border-radius:0;padding:7px 10px}
button{cursor:pointer;clip-path:polygon(0 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%)}
button:hover{border-color:var(--accent)}button:disabled,textarea:disabled{opacity:.65}
:is(button,select,textarea,a,#stream):focus-visible{outline:2px solid var(--ink);outline-offset:-3px}
select{width:100%;margin:7px 0 13px}.hint{font-size:13px}.warn{color:var(--accent)}
.meeting{display:block;width:100%;text-align:left;margin:5px 0 8px;overflow-wrap:anywhere}
.meeting[aria-current=true],#follow,form button{background:var(--accent);color:var(--signal-ink);font-weight:700}
.meeting[aria-current=true] small{color:var(--signal-ink)}.meeting small{display:block}
#state{margin:7px 0 14px;font-size:13px}
.record{background:var(--panel);border-top:3px solid var(--accent)}
.record-heading,.record-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.record-heading{justify-content:space-between;padding:8px 16px;min-height:48px;border-bottom:1px solid var(--line)}
.record-heading time,article small{font-variant-numeric:tabular-nums;font-size:12px}
#feed-status:not(:empty),#post-status:not(:empty){padding:8px 16px;border-bottom:1px solid var(--line)}
#members{display:flex;flex-wrap:wrap;gap:6px 16px;padding:8px 16px;border-bottom:1px solid var(--line)}
#members:empty{display:none}.member{font-size:13px}.member.live{background:var(--accent);color:var(--signal-ink);padding:0 5px}
#stream{max-height:clamp(220px,43dvh,550px);min-height:12dvh;overflow:auto;overflow-anchor:none;scrollbar-color:#526173 var(--panel)}
article{border-bottom:1px solid var(--line);padding:13px 17px}article small{padding-left:9px}
article p{max-width:42em;line-height:1.88;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:4px}
article.owner strong{color:var(--accent)}
form{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:7px;padding:10px 16px}
form label{grid-column:1/-1;font-size:13px;color:var(--muted)}
textarea{width:100%;min-height:58px;resize:vertical;background:var(--bg)}
@media(max-width:680px){main{grid-template-columns:1fr;min-height:auto;gap:16px}aside{max-height:38dvh;overflow:auto}}
</style>
<header class="top"><a href="/" id="workbench">返回深海工作台</a><span>__TARGET__</span></header>
<main>
  <section aria-labelledby="topic">
    <h1 id="topic">选择一场组会</h1>
    <p id="state" class="muted"></p>
    <div class="record">
      <div class="record-heading"><h2>会议记录</h2><div class="record-actions"><time id="read-time"></time><button id="follow" type="button" hidden>回到最新</button></div></div>
      <p id="feed-status" class="hint warn" role="status"></p>
      <div id="members"></div>
      <div id="stream" role="log" aria-label="组会发言" tabindex="0"></div>
      <form id="post" hidden>
        <label for="comment">以主人身份插话</label>
        <textarea id="comment" maxlength="8000" required></textarea>
        <button type="submit">发送</button>
      </form>
      <p id="post-status" class="hint warn" role="status"></p>
    </div>
  </section>
  <aside aria-label="会议列表">
    <h2>会议列表</h2>
    <label for="group" class="muted">会议分组</label>
    <select id="group"><option value="current">当前人格</option><option value="formal">正式</option><option value="test">测试</option></select>
    <div id="meetings"></div>
    <p id="list-status" class="hint warn" role="status"></p>
  </aside>
</main>
<script>
const $ = id => document.getElementById(id);
const path = '/api/dsh-team/meeting';
const states = {queued:'等待开始', running:'进行中', paused:'已暂停', go_wait:'等待 Go 额度', stopping:'正在结束',
  completed:'已结束', stopped:'已停止', needs_review:'待核实'};
const memberStates = {waiting:'等待', thinking:'思考中', spoken:'已发言', listening:'旁听', left:'已离开',
  failed:'本轮未完成', unconfirmed:'待核实', closed:'已结束'};
const active = new Set(['queued','running','paused','go_wait','stopping']);
const url = new URL(location.href);
const initialView = url.searchParams.get('view');
const displayTime = new Intl.DateTimeFormat('zh-CN', {timeZone:'Asia/Shanghai', hour:'2-digit', minute:'2-digit', second:'2-digit', hourCycle:'h23'});
if (window.self !== window.top) {
  $('workbench').target = '_blank';
  $('workbench').rel = 'noopener';
}
$('group').value = ['formal','test'].includes(initialView) ? initialView : 'current';
let live, listSignature = '';
const node = (tag, value = '', cls = '') => {
  const result = document.createElement(tag);
  result.textContent = value;
  result.className = cls;
  return result;
};
async function api(params, method = 'GET', body) {
  const response = await fetch(path + '?' + new URLSearchParams(params), {
    method, cache:'no-store', headers:body ? {'Content-Type':'application/json'} : {}, body:body && JSON.stringify(body)
  });
  if (response.status === 401) throw Error('请从 FishHome 控制台打开会场或重新打开 DSH。');
  const result = await response.json();
  if (!response.ok) throw Error(result.error || '会场暂时不可达。');
  return result;
}
function select(id) {
  if (live) clearTimeout(live.timer);
  const view = $('group').value;
  const params = new URLSearchParams({view});
  if (id) params.set('id', id);
  history.replaceState(null, '', location.pathname + '?' + params);
  live = id ? {id, view, after:0, receipts:new Map()} : null;
  $('topic').textContent = id ? '正在打开组会' : '选择一场组会';
  for (const name of ['state','members','stream','feed-status','read-time','post-status']) $(name).replaceChildren();
  for (const item of $('meetings').querySelectorAll('button[data-meeting]')) {
    item.setAttribute('aria-current', String(item.dataset.meeting === id));
  }
  $('post').hidden = true;
  $('follow').hidden = true;
  $('comment').disabled = $('post').querySelector('button').disabled = false;
  $('comment').value = '';
  if (live) poll(live);
}
function listGroup(title, meetings) {
  return [node('h3', title), ...(meetings.length ? meetings.map(meeting => {
    const button = node('button', meeting.topic, 'meeting');
    button.type = 'button';
    button.dataset.meeting = meeting.id;
    button.setAttribute('aria-current', String(meeting.id === live?.id));
    button.append(node('small', [meeting.style === 'casual' ? '茶会' : '讨论会',
      states[meeting.status] || meeting.status, meeting.rounds ? meeting.round + '/' + meeting.rounds + ' 轮' :
        '已聊 ' + meeting.round + ' 轮'].join(' · '), active.has(meeting.status) ? 'live' : ''));
    button.onclick = () => select(meeting.id);
    return button;
  }) : [node('p','暂无会议','muted hint')])];
}
let listTimer, listRead;
async function list() {
  clearTimeout(listTimer);
  const read = listRead = {};
  const view = $('group').value;
  try {
    const result = await api({view});
    if (listRead !== read) return;
    $('list-status').textContent = '';
    const signature = JSON.stringify(result);
    if (signature !== listSignature) {
      listSignature = signature;
      $('meetings').replaceChildren(...listGroup('进行中',result.meetings.filter(m => active.has(m.status))),
        ...listGroup('历史组会',result.meetings.filter(m => !active.has(m.status))));
    }
  } catch (error) {
    if (listRead === read) $('list-status').textContent = error.message;
  } finally {
    if (listRead === read) {
      listTimer = setTimeout(list, document.hidden ? 6000 : 1500);
    }
  }
}
function render(meeting, state) {
  $('topic').textContent = state.topic;
  const rounds = state.round_limit || (state.style !== 'casual' && state.rounds);
  const group = {current:'当前人格', formal:'正式记录', test:'测试记录'}[meeting.view];
  $('state').textContent = [state.style === 'casual' ? '茶会' : '讨论会', states[state.status] || state.status,
    state.current_round ? '第 ' + state.current_round + (rounds ? ' / ' + rounds : '') + ' 轮' : '',
    group, !state.can_post ? '只读' : '可插话'].filter(Boolean).join(' · ');
  meeting.offline = false;
  meeting.readAt = displayTime.format(Date.now());
  $('read-time').textContent = '读到 ' + meeting.readAt;
  $('feed-status').textContent = '';
  const members = state.members.map(member => node('span',
    `${member.name} · ${memberStates[member.status] || member.status}`,
    member.status === 'thinking' ? 'member live' : 'member'));
  if ($('members').textContent !== members.map(member => member.textContent).join('')) $('members').replaceChildren(...members);
  const stream = $('stream');
  const follow = caughtUp();
  for (const entry of state.transcript) {
    const item = node('article', '', entry.receipt ? 'owner' : '');
    item.append(node('strong', entry.name || (entry.kind === 'host' ? '大肥鱼' : '会议记录')),
      node('small', [entry.round ? '第 ' + entry.round + ' 轮' : '', displayTime.format(entry.at * 1000)]
        .filter(Boolean).join(' · ')), node('p', entry.text || ''));
    if (entry.receipt) {
      const label = node('small');
      meeting.receipts.set(entry.receipt, label);
      item.append(label);
    }
    stream.append(item);
  }
  for (const [id, label] of meeting.receipts) {
    const names = (state.owner_receipts[id] || []).map(id => state.members.find(member => member.id === id)?.name || id);
    label.textContent = names.length ? '已进入发言上下文 · ' + names.join('、')
      : state.active ? '等待后续发言接收' : '散场前未确认有成员接收';
  }
  meeting.after = state.next_after;
  $('post').hidden = !state.can_post;
  if (!meeting.sending) $('comment').disabled = $('post').querySelector('button').disabled = false;
  if (follow) {
    stream.scrollTop = stream.scrollHeight;
    $('follow').hidden = true;
  } else if (state.transcript.length) {
    $('follow').hidden = false;
  }
}
function caughtUp() {
  const stream = $('stream');
  return stream.scrollHeight - stream.scrollTop - stream.clientHeight < 35;
}
$('stream').onscroll = () => { if (caughtUp()) $('follow').hidden = true; };
$('follow').onclick = () => {
  const stream = $('stream');
  stream.scrollTop = stream.scrollHeight;
  $('follow').hidden = true;
  stream.focus({preventScroll:true});
};
function params(meeting) {
  return {id:meeting.id, view:meeting.view, after:meeting.after};
}
async function poll(meeting) {
  if (live !== meeting) return;
  let delay = document.hidden ? 5000 : 1200;
  try {
    const cursor = meeting.after;
    const state = await api(params(meeting));
    if (live !== meeting) return;
    if (!meeting.sending && cursor === meeting.after) {
      render(meeting, state);
      if (!state.active && meeting.after >= state.transcript_count) return;
      if (meeting.after < state.transcript_count) delay = 0;
    }
  } catch (error) {
    if (live !== meeting) return;
    meeting.offline = true;
    $('feed-status').textContent = error.message;
    $('read-time').textContent = meeting.readAt ? '上次读到 ' + meeting.readAt : '尚未读到会议记录';
    $('comment').disabled = $('post').querySelector('button').disabled = true;
    delay = 3000;
  }
  meeting.timer = setTimeout(() => poll(meeting), delay);
}
$('post').addEventListener('submit', async event => {
  event.preventDefault();
  const meeting = live, input = $('comment'), submit = event.submitter, text = input.value.trim();
  if (!meeting || !text || meeting.sending || meeting.offline) return;
  if (meeting.draft?.text !== text) meeting.draft = {text, post_id:crypto.randomUUID().replaceAll('-','')};
  meeting.sending = submit.disabled = input.disabled = true;
  try {
    const state = await api(params(meeting),'POST',meeting.draft);
    if (live !== meeting) return;
    input.value = '';
    meeting.draft = null;
    $('post-status').textContent = '';
    render(meeting,state);
  } catch (error) {
    if (live !== meeting) return;
    $('post-status').textContent = error.message;
  } finally {
    if (live === meeting) {
      meeting.sending = false;
      submit.disabled = input.disabled = !!meeting.offline;
    }
  }
});
$('group').onchange = () => { listSignature = ''; select(null); list(); };
select(url.searchParams.get('id'));
list();
</script>
