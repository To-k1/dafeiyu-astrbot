<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>伙伴直聊 · FishHome</title>
<script>
(() => {
  const q = new URLSearchParams(location.search);
  const t = q.get('theme');
  const saved = (() => { try { return localStorage.getItem('fishhome-meeting-theme'); } catch { return ''; } })();
  const dark = t === 'dark' || (t !== 'light' && (saved ? saved === 'dark' : matchMedia('(prefers-color-scheme:dark)').matches));
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  if (q.get('embed') === 'dsh' || window.self !== window.top) document.documentElement.dataset.embed = 'dsh';
})();
</script>
<style>
:root{
  color-scheme:light;
  --bg:#ffffff;--sidebar:#f9fafb;--surface:#ffffff;--surface-2:#f5f6f7;
  --composer:#ffffff;--bubble:#edf3fe;--code-bg:#f6f8fa;--inline-code:#f1f3f5;
  --border-1:rgba(0,0,0,.05);--border-2:rgba(0,0,0,.09);--border-3:rgba(0,0,0,.13);
  --ink:#0f1115;--ink-2:#5c626a;--ink-3:#81858c;--caption:#9ea4ad;
  --accent:#4176e6;--accent-hover:#3164d4;--accent-soft:#e4edfd;--accent-ink:#ffffff;
  --hover:rgba(38,49,72,.055);--active:rgba(38,49,72,.10);
  --ok:#16a34a;--ok-soft:#e6faed;--warn:#d97706;--warn-soft:#fef5e7;--err:#dc2626;--err-soft:#fef2f2;
  --shadow-soft:0 0 0 .5px rgba(0,0,0,.10),0 4px 16px rgba(0,0,0,.045),0 0 24px rgba(0,0,0,.025);
  --shadow-float:0 0 0 .5px rgba(0,0,0,.12),0 6px 18px rgba(0,0,0,.08);
  --chat-w:clamp(640px,76%,860px);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:"SF Mono","JetBrains Mono","Fira Code",Consolas,Menlo,monospace;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#151517;--sidebar:#1b1b1c;--surface:#232324;--surface-2:#2c2c2e;
  --composer:#2c2c2e;--bubble:#2c2c2e;--code-bg:#1b1b1c;--inline-code:#2a2a2d;
  --border-1:rgba(255,255,255,.06);--border-2:rgba(255,255,255,.11);--border-3:rgba(255,255,255,.16);
  --ink:#f5f6f8;--ink-2:#cfd3d6;--ink-3:#9ca3af;--caption:#7b818c;
  --accent:#7aaaff;--accent-hover:#5f97fa;--accent-soft:rgba(122,170,255,.16);--accent-ink:#0f1115;
  --hover:rgba(255,255,255,.065);--active:rgba(255,255,255,.12);
  --ok:#22c55e;--ok-soft:rgba(34,197,94,.14);--warn:#f59e0b;--warn-soft:rgba(245,158,11,.14);--err:#f25a5a;--err-soft:rgba(242,90,90,.14);
  --shadow-soft:0 0 0 .5px rgba(255,255,255,.11),0 6px 20px rgba(0,0,0,.28);
  --shadow-float:0 0 0 .5px rgba(255,255,255,.14),0 6px 20px rgba(0,0,0,.40);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.6 var(--font);-webkit-font-smoothing:antialiased}
button,textarea,input,select,a{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
:is(button,textarea,input,select,a,#turns):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-3);border-radius:999px}
.app{display:flex;height:100dvh;width:100%;overflow:hidden;position:relative}
.backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:19}
/* Sidebar */
.sidebar{width:272px;flex:0 0 272px;background:var(--sidebar);border-right:.5px solid var(--border-3);display:flex;flex-direction:column;transition:width .18s ease,opacity .16s ease;overflow:hidden;z-index:20}
.app[data-collapsed="true"] .sidebar{width:0;flex-basis:0;border-right:0;opacity:0;pointer-events:none}
.app:not([data-collapsed="true"]) #side-open{display:none}
.side-top{height:52px;padding:0 10px 0 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-shrink:0}
.side-title{display:flex;align-items:center;gap:8px;min-width:0}
.side-title strong{font-size:14px;font-weight:600;white-space:nowrap}
.target-tag{font-size:11px;color:var(--ink-3);background:var(--surface-2);border:.5px solid var(--border-2);border-radius:999px;padding:1px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
.icon-btn{width:30px;height:30px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2);flex-shrink:0;transition:background .12s,color .12s}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.icon-btn svg,.send-btn svg,.follow-btn svg{width:16px;height:16px;display:block;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-seg{margin:2px 10px 10px;padding:3px;background:var(--surface-2);border:.5px solid var(--border-1);border-radius:10px;display:grid;grid-template-columns:1fr 1fr;gap:2px;flex-shrink:0}
.nav-seg a{height:28px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--ink-2);text-decoration:none;display:flex;align-items:center;justify-content:center;transition:background .12s,color .12s}
.nav-seg a:hover{color:var(--ink)}
.nav-seg a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.agent-box{padding:0 10px 10px;display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.agent-box label{font-size:11.5px;color:var(--ink-3);font-weight:500;padding-left:2px}
.agent-select{width:100%;height:36px;padding:0 10px;border-radius:10px;background:var(--surface);border:.5px solid var(--border-3);color:var(--ink);font-size:13.5px;font-weight:500}
.agent-meta{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-3);padding-left:2px}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;background:var(--caption)}
.dot.live{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);animation:pulse 1.8s infinite}
.dot.ok{background:var(--ok)}
.dot.warn{background:var(--warn)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(.85)}}
.new-form{padding:0 10px 10px;display:flex;gap:6px;flex-shrink:0}
.new-form input{flex:1;min-width:0;height:34px;padding:0 10px;border-radius:10px;background:var(--surface);border:.5px solid var(--border-2);font-size:12.5px}
.new-form input::placeholder{color:var(--caption)}
.new-btn{height:34px;padding:0 11px;border-radius:10px;background:var(--surface);border:.5px solid var(--border-3);font-size:12.5px;font-weight:500;color:var(--ink);white-space:nowrap;transition:background .12s,border-color .12s}
.new-btn:hover:not(:disabled){background:var(--hover);border-color:var(--accent)}
.new-btn:disabled{opacity:.42;cursor:default}
.side-list{flex:1;overflow-y:auto;padding:2px 8px 12px}
.group-label{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 5px;font-size:11px;font-weight:600;color:var(--ink-3)}
.sess-item{width:100%;text-align:left;padding:8px 10px;border-radius:11px;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2px;transition:background .12s;color:var(--ink)}
.sess-item:hover:not(:disabled){background:var(--hover)}
.sess-item[aria-current="true"]{background:var(--active);font-weight:500}
.sess-item.archived{color:var(--ink-3)}
.sess-title{font-size:13.5px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.sess-badge{font-size:10.5px;color:var(--ink-3);background:var(--surface-2);padding:1px 6px;border-radius:999px;flex-shrink:0}
.empty-list{padding:8px 10px;font-size:12px;color:var(--caption)}
.side-foot{padding:8px 10px;border-top:.5px solid var(--border-2);flex-shrink:0}
.side-foot a{font-size:12.5px;color:var(--ink-2);text-decoration:none;display:inline-flex;align-items:center;gap:6px;padding:6px 8px;border-radius:8px;width:100%;transition:background .12s,color .12s}
.side-foot a:hover{background:var(--hover);color:var(--ink)}
:root[data-embed="dsh"] .side-foot{display:none}
/* Main Stage */
.stage{flex:1;min-width:0;display:flex;flex-direction:column;height:100dvh;position:relative;background:var(--bg)}
.head{min-height:52px;padding:8px 18px 8px 14px;border-bottom:.5px solid var(--border-2);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-shrink:0}
.head-left{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
h1{margin:0;font-size:15px;font-weight:600;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:min(48vw,520px)}
.head-right{display:flex;align-items:center;gap:4px;flex-shrink:0}
.text-btn{height:28px;padding:0 9px;border-radius:8px;font-size:12px;color:var(--ink-2);display:inline-flex;align-items:center;gap:5px;transition:background .12s,color .12s;white-space:nowrap}
.text-btn:hover:not(:disabled){background:var(--hover);color:var(--ink)}
.text-btn:disabled{opacity:.4;cursor:default}
.text-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ext-link{text-decoration:none}
:root:not([data-embed="dsh"]) #ext-workbench{display:none}
:root[data-embed="dsh"] #theme-btn{display:none}
/* Stream */
#turns{flex:1;overflow-y:auto;overflow-anchor:none;padding:22px 20px 28px}
.track{width:min(100%,var(--chat-w));margin:0 auto;display:flex;flex-direction:column;gap:20px}
.empty-stage{margin:auto;text-align:center;max-width:340px;padding:52px 20px;color:var(--ink-3)}
.empty-stage svg{width:34px;height:34px;stroke:var(--caption);fill:none;stroke-width:1.4;margin-bottom:10px}
.empty-stage strong{display:block;font-size:15px;color:var(--ink);margin-bottom:4px;font-weight:600}
.empty-stage p{margin:0;font-size:13px;line-height:1.6}
.msg{display:flex;flex-direction:column;gap:5px}
.msg.owner{align-self:flex-end;align-items:flex-end;max-width:min(78%,620px)}
.msg.owner .bubble{background:var(--bubble);color:var(--ink);border-radius:20px;padding:10px 16px;font-size:14px;line-height:1.68;overflow-wrap:anywhere}
.msg.owner .owner-meta{display:flex;align-items:center;gap:8px;padding:0 6px;font-size:11.5px;color:var(--ink-3)}
.msg.assistant{width:100%}
.msg-head{display:flex;align-items:center;gap:8px;min-height:24px}
.avatar{width:22px;height:22px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:650;flex-shrink:0;user-select:none;background:hsla(var(--av-h,215),52%,45%,.14);color:hsl(var(--av-h,215),56%,36%)}
:root[data-theme="dark"] .avatar{background:hsla(var(--av-h,215),52%,56%,.20);color:hsl(var(--av-h,215),76%,74%)}
.speaker{font-size:13.5px;font-weight:600;color:var(--ink)}
.msg-time{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.msg-actions{margin-left:auto;display:inline-flex;align-items:center;gap:2px;opacity:0;transition:opacity .12s}
.msg:hover .msg-actions,.msg:focus-within .msg-actions{opacity:1}
.mini-btn{height:24px;padding:0 7px;border-radius:6px;font-size:11.5px;color:var(--ink-3);display:inline-flex;align-items:center;gap:4px}
.mini-btn:hover{background:var(--hover);color:var(--ink)}
.mini-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.msg-body{padding-left:30px;font-size:14px;line-height:1.76;color:var(--ink);overflow-wrap:anywhere}
.status-row{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2)}
.mem-chip{display:inline-flex;align-items:center;gap:5px;margin-top:8px;padding:2px 8px;border-radius:999px;font-size:11.5px;background:var(--ok-soft);color:var(--ok)}
.mem-chip.warn{background:var(--warn-soft);color:var(--warn)}
/* Markdown */
.md>*:first-child{margin-top:0}.md>*:last-child{margin-bottom:0}
.md p{margin:0 0 10px;white-space:pre-wrap}
.md h1,.md h2,.md h3,.md h4{margin:14px 0 6px;line-height:1.35;font-weight:600}
.md h1{font-size:18px}.md h2{font-size:16px}.md h3{font-size:14.5px}.md h4{font-size:14px}
.md ul,.md ol{margin:4px 0 10px;padding-left:20px}
.md li{margin:3px 0}
.md blockquote{margin:8px 0;padding:4px 12px;border-left:2.5px solid var(--border-3);color:var(--ink-2)}
.md hr{border:0;border-top:.5px solid var(--border-2);margin:12px 0}
.md code{font-family:var(--mono);font-size:12.5px;background:var(--inline-code);padding:1.5px 5px;border-radius:5px}
.md a{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.md table{width:100%;border-collapse:collapse;margin:8px 0 12px;font-size:13px}
.md th,.md td{border:.5px solid var(--border-2);padding:6px 10px;text-align:left}
.md th{background:var(--surface-2);font-weight:600}
.code-box{margin:8px 0 12px;border-radius:12px;background:var(--code-bg);border:.5px solid var(--border-2);overflow:hidden}
.code-head{display:flex;align-items:center;justify-content:space-between;padding:5px 10px 5px 12px;border-bottom:.5px solid var(--border-1);font-size:11.5px;color:var(--ink-3);font-family:var(--mono)}
.code-box pre{margin:0;padding:10px 12px;overflow-x:auto;font:12.5px/1.55 var(--mono)}
.code-box pre code{background:none;padding:0;font-size:inherit}
/* Floating follow & Composer */
.follow-btn{position:absolute;left:50%;transform:translateX(-50%);bottom:118px;width:34px;height:34px;border-radius:999px;background:var(--surface);color:var(--ink);box-shadow:var(--shadow-float);display:inline-flex;align-items:center;justify-content:center;z-index:10}
.follow-btn:hover{background:var(--surface-2)}
.composer-wrap{flex-shrink:0;padding:4px 20px 14px;background:linear-gradient(180deg,transparent 0%,var(--bg) 28%)}
.composer{width:min(100%,calc(var(--chat-w) + 24px));margin:0 auto;background:var(--composer);border-radius:24px;box-shadow:var(--shadow-soft);padding:10px 10px 8px 16px;display:flex;flex-direction:column;gap:6px}
.composer textarea{width:100%;border:0;background:transparent;resize:none;min-height:26px;max-height:200px;padding:2px 6px 2px 0;font-size:14px;line-height:1.55;outline:none;color:var(--ink)}
.composer textarea::placeholder{color:var(--caption)}
.composer textarea:disabled{opacity:.55}
.composer-foot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.composer-hint{font-size:11.5px;color:var(--ink-3)}
.send-btn{width:34px;height:34px;border-radius:999px;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .12s,opacity .12s}
.send-btn:hover:not(:disabled){background:var(--accent-hover)}
.send-btn:disabled{opacity:.38;cursor:default}
.status-line{width:min(100%,calc(var(--chat-w) + 24px));margin:6px auto 0;font-size:12px;color:var(--ink-3);padding:0 10px;min-height:1.2em}
.status-line.err{color:var(--err)}
@media(max-width:860px){
  .app:not([data-collapsed="true"]) #side-open{display:inline-flex}
  .sidebar{position:fixed;top:0;bottom:0;left:0;width:min(82vw,284px);flex-basis:auto;box-shadow:var(--shadow-float)}
  .app[data-collapsed="true"] .sidebar{transform:translateX(-100%);width:min(82vw,284px)}
  .app:not([data-collapsed="true"]) .backdrop{display:block}
  .msg-body{padding-left:0}
  .msg.owner{max-width:90%}
  #turns{padding:16px 14px 24px}
  .composer-wrap{padding:4px 12px 12px}
}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="backdrop" id="backdrop"></div>
  <aside class="sidebar" aria-label="伙伴与会话">
    <div class="side-top">
      <div class="side-title"><strong>主人工作台</strong><span class="target-tag" title="__TARGET__">__TARGET__</span></div>
      <button class="icon-btn" id="side-close" type="button" title="收起侧栏" aria-label="收起侧栏">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/></svg>
      </button>
    </div>
    <nav class="nav-seg" aria-label="主人工作台">
      <a href="/owner-work" id="nav-work">直接派活</a>
      <a href="/owner-work/chat" id="nav-chat" aria-current="page">伙伴直聊</a>
    </nav>
    <div class="agent-box">
      <label for="agent">当前伙伴</label>
      <select class="agent-select" id="agent" disabled></select>
      <div class="agent-meta"><span class="dot" id="ready-dot"></span><span id="group">正在读取名册…</span></div>
    </div>
    <form class="new-form" id="new">
      <input id="title" maxlength="80" placeholder="新对话标题（可留空）" aria-label="新对话标题">
      <button class="new-btn" id="create" type="submit" disabled>+ 新建</button>
    </form>
    <div class="side-list">
      <div id="sessions"></div>
    </div>
    <div class="side-foot">
      <a href="/" id="workbench">← 返回深海工作台</a>
    </div>
  </aside>
  <section class="stage" aria-labelledby="topic">
    <header class="head">
      <div class="head-left">
        <button class="icon-btn" id="side-open" type="button" title="展开侧栏" aria-label="展开侧栏">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/></svg>
        </button>
        <h1 id="topic">选择一位伙伴</h1>
      </div>
      <div class="head-right">
        <button class="text-btn" id="copy-chat" type="button" disabled title="复制当前对话为 Markdown">
          <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><span>复制对话</span>
        </button>
        <button class="text-btn" id="archive" type="button" hidden></button>
        <a class="icon-btn ext-link" id="ext-workbench" href="/" target="_blank" rel="noopener" title="在新标签页打开深海工作台" aria-label="打开深海工作台">
          <svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        </a>
        <button class="icon-btn" id="theme-btn" type="button" title="切换明暗主题" aria-label="切换明暗主题"></button>
      </div>
    </header>
    <div id="turns" role="region" aria-label="聊天记录" tabindex="0">
      <div class="track" id="track"></div>
    </div>
    <button class="follow-btn" id="follow" type="button" hidden title="回到最新" aria-label="回到最新">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>
    </button>
    <div class="composer-wrap">
      <form class="composer" id="compose">
        <textarea id="message" rows="1" maxlength="2000" required placeholder="给伙伴发消息…" aria-label="消息"></textarea>
        <div class="composer-foot">
          <span class="composer-hint" id="composer-hint">Enter 发送 · Shift+Enter 换行</span>
          <button class="send-btn" id="send" disabled type="submit" title="发送消息" aria-label="发送消息">
            <svg viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
          </button>
        </div>
      </form>
      <p id="status" class="status-line" role="status"></p>
    </div>
  </section>
</div>
<script>
const $ = id => document.getElementById(id);
const path = '/api/owner-work/chat';
const labels = {queued:'已排队，等待开始', running:'伙伴思考中…', go_wait:'等待 Go 订阅额度', needs_review:'待核实'};
const activeStates = new Set(['queued','running','go_wait']);
const ALLOWED_PARENT = /^http:\/\/127\.0\.0\.1:(59934|59935|15934)$/;
const fmtTime = new Intl.DateTimeFormat('zh-CN', {timeZone:'Asia/Shanghai', hour:'2-digit', minute:'2-digit', second:'2-digit', hourCycle:'h23'});
let agent='', session='', group='', data=null, ready=false, busy=false, reading=0, pending;
let agentSignature='', sessionSignature='', turnSignature='';

const el = (tag, cls = '', text = '') => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text) n.textContent = text;
  return n;
};
const svgIcon = paths => {
  const ns = 'http://www.w3.org/2000/svg';
  const s = document.createElementNS(ns, 'svg');
  s.setAttribute('viewBox', '0 0 24 24');
  for (const [tag, attrs] of paths) {
    const p = document.createElementNS(ns, tag);
    for (const [k, v] of Object.entries(attrs)) p.setAttribute(k, v);
    s.append(p);
  }
  return s;
};
const COPY_SVG = () => svgIcon([['rect',{x:'9',y:'9',width:'13',height:'13',rx:'2'}],['path',{d:'M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1'}]]);
const SUN_SVG = () => svgIcon([['circle',{cx:'12',cy:'12',r:'4'}],['path',{d:'M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41'}]]);
const MOON_SVG = () => svgIcon([['path',{d:'M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z'}]]);

function syncNavLinks() {
  const q = new URLSearchParams();
  if (document.documentElement.dataset.embed === 'dsh') q.set('embed', 'dsh');
  const theme = document.documentElement.dataset.theme;
  if (theme) q.set('theme', theme);
  const qs = q.toString() ? '?' + q.toString() : '';
  $('nav-work').href = '/owner-work' + qs;
  $('nav-chat').href = '/owner-work/chat' + qs;
}
function setTheme(theme, persist = false) {
  if (theme !== 'dark' && theme !== 'light') return;
  document.documentElement.dataset.theme = theme;
  if (persist) { try { localStorage.setItem('fishhome-meeting-theme', theme); } catch {} }
  $('theme-btn').replaceChildren(theme === 'dark' ? SUN_SVG() : MOON_SVG());
  $('theme-btn').title = theme === 'dark' ? '切换浅色主题' : '切换深色主题';
  syncNavLinks();
}
setTheme(document.documentElement.dataset.theme || 'dark', false);
$('theme-btn').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark', true);
window.addEventListener('message', event => {
  if (event.source !== window.parent || !ALLOWED_PARENT.test(event.origin)) return;
  if (event.data && event.data.type === 'fishhome-theme') setTheme(event.data.theme, false);
});

function setCollapsed(flag, persist = true) {
  $('app').dataset.collapsed = String(!!flag);
  if (persist && window.innerWidth > 860) { try { localStorage.setItem('fishhome-chat-collapsed', flag ? '1' : '0'); } catch {} }
}
(() => {
  const saved = (() => { try { return localStorage.getItem('fishhome-chat-collapsed'); } catch { return ''; } })();
  if (window.innerWidth <= 860) setCollapsed(true, false);
  else if (saved === '1') setCollapsed(true, false);
})();
$('side-close').onclick = () => setCollapsed(true);
$('side-open').onclick = () => setCollapsed($('app').dataset.collapsed !== 'true');
$('backdrop').onclick = () => setCollapsed(true, false);

function avatarHue(name) {
  let h = 0;
  for (const ch of String(name || '?')) h = (h * 31 + ch.codePointAt(0)) % 360;
  return h;
}
async function copyText(text, btn, label) {
  try {
    await navigator.clipboard.writeText(text);
    const sp = btn.querySelector('span');
    if (sp) { sp.textContent = '已复制'; setTimeout(() => { sp.textContent = label; }, 1400); }
  } catch {}
}

function renderInline(text) {
  const frag = document.createDocumentFragment();
  const re = /(`[^`\n]+`|\*\*[^*\n]+\*\*|~~[^~\n]+~~|\*[^*\n]+\*|\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)|(https?:\/\/[^\s<>()]+))/g;
  let last = 0, m;
  while ((m = re.exec(text)) !== null) {
    if (m.index > last) frag.append(text.slice(last, m.index));
    const tok = m[0];
    if (tok.startsWith('`')) frag.append(el('code', '', tok.slice(1, -1)));
    else if (tok.startsWith('**')) frag.append(el('strong', '', tok.slice(2, -2)));
    else if (tok.startsWith('~~')) frag.append(el('del', '', tok.slice(2, -2)));
    else if (tok.startsWith('*')) frag.append(el('em', '', tok.slice(1, -1)));
    else if (m[2] && m[3]) { const a = el('a', '', m[2]); a.href = m[3]; a.target = '_blank'; a.rel = 'noopener noreferrer'; frag.append(a); }
    else if (m[4]) { const a = el('a', '', m[4]); a.href = m[4]; a.target = '_blank'; a.rel = 'noopener noreferrer'; frag.append(a); }
    last = re.lastIndex;
  }
  if (last < text.length) frag.append(text.slice(last));
  return frag;
}
function renderMarkdown(raw) {
  const box = el('div', 'md');
  const lines = String(raw || '').replace(/\r\n?/g, '\n').split('\n');
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { i++; continue; }
    const fence = line.match(/^```([\w.+-]*)\s*$/);
    if (fence) {
      const lang = fence[1] || 'text', code = [];
      i++;
      while (i < lines.length && !/^```\s*$/.test(lines[i])) { code.push(lines[i]); i++; }
      if (i < lines.length) i++;
      const wrap = el('div', 'code-box'), head = el('div', 'code-head');
      head.append(el('span', '', lang));
      const cbtn = el('button', 'mini-btn'); cbtn.type = 'button'; cbtn.append(COPY_SVG(), el('span', '', '复制'));
      const joined = code.join('\n');
      cbtn.onclick = () => copyText(joined, cbtn, '复制');
      head.append(cbtn);
      const pre = el('pre'); pre.append(el('code', '', joined));
      wrap.append(head, pre); box.append(wrap); continue;
    }
    const hd = line.match(/^(#{1,4})\s+(.+)$/);
    if (hd) { const h = el('h' + hd[1].length); h.append(renderInline(hd[2].trim())); box.append(h); i++; continue; }
    if (/^(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { box.append(el('hr')); i++; continue; }
    if (line.startsWith('>')) {
      const q = [];
      while (i < lines.length && lines[i].startsWith('>')) { q.push(lines[i].replace(/^>\s?/, '')); i++; }
      const bq = el('blockquote'), p = el('p'); p.append(renderInline(q.join('\n'))); bq.append(p); box.append(bq); continue;
    }
    if (line.includes('|') && i + 1 < lines.length && /^\s*\|?(\s*:?-{3,}:?\s*\|)+\s*:?-{3,}:?\s*\|?\s*$/.test(lines[i + 1])) {
      const parseRow = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      const tbl = el('table'), thead = el('thead'), tr = el('tr');
      for (const cell of parseRow(line)) { const th = el('th'); th.append(renderInline(cell)); tr.append(th); }
      thead.append(tr); tbl.append(thead); i += 2;
      const tbody = el('tbody');
      while (i < lines.length && lines[i].includes('|') && lines[i].trim()) {
        const btr = el('tr');
        for (const cell of parseRow(lines[i])) { const td = el('td'); td.append(renderInline(cell)); btr.append(td); }
        tbody.append(btr); i++;
      }
      tbl.append(tbody); box.append(tbl); continue;
    }
    if (/^\s*[-*•]\s+/.test(line)) {
      const ul = el('ul');
      while (i < lines.length && /^\s*[-*•]\s+/.test(lines[i])) {
        const li = el('li'); li.append(renderInline(lines[i].replace(/^\s*[-*•]\s+/, ''))); ul.append(li); i++;
      }
      box.append(ul); continue;
    }
    if (/^\s*\d+\.\s+/.test(line)) {
      const ol = el('ol');
      while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
        const li = el('li'); li.append(renderInline(lines[i].replace(/^\s*\d+\.\s+/, ''))); ol.append(li); i++;
      }
      box.append(ol); continue;
    }
    const para = [];
    while (i < lines.length && lines[i].trim() && !lines[i].match(/^(```|#{1,4}\s|>|[-*•]\s|\d+\.\s|(-{3,}|\*{3,})\s*$)/)) {
      para.push(lines[i]); i++;
    }
    const p = el('p'); p.append(renderInline(para.join('\n'))); box.append(p);
  }
  return box;
}

async function api(query = {}, body) {
  const response = await fetch(path + '?' + new URLSearchParams(query), {
    method: body ? 'POST' : 'GET', cache: 'no-store',
    headers: body ? {'Content-Type':'application/json'} : {},
    body: body && JSON.stringify(body),
  });
  if (response.status === 401) throw Error('请从 FishHome 控制台重新打开 DSH。');
  const result = await response.json().catch(() => ({}));
  if (!response.ok) throw Error(result.error || '暂时无法读取直聊。');
  return result;
}
function sessionRow() { return data?.sessions.find(row => row.id === session); }
function setStatus(text, isErr = false) {
  $('status').textContent = text || '';
  $('status').className = 'status-line' + (isErr ? ' err' : '');
}
function controls() {
  const row = sessionRow(), available = ready && !busy && data?.agent.status === 'active';
  $('create').disabled = !available;
  $('message').disabled = $('send').disabled = !available || !row || row.status !== 'active';
  $('archive').hidden = !row || !available;
  $('archive').textContent = row?.status === 'archived' ? '恢复对话' : '归档对话';
  $('copy-chat').disabled = !(data?.turns?.length);
}
function caughtUp() {
  const f = $('turns');
  return f.scrollHeight - f.scrollTop - f.clientHeight < 48;
}
$('turns').onscroll = () => { if (caughtUp()) $('follow').hidden = true; };
$('follow').onclick = () => { $('turns').scrollTop = $('turns').scrollHeight; $('follow').hidden = true; };

function autoGrow() {
  const t = $('message');
  t.style.height = 'auto';
  t.style.height = Math.min(t.scrollHeight, 200) + 'px';
  const len = t.value.length;
  $('composer-hint').textContent = len > 400 ? `Enter 发送 · Shift+Enter 换行 · ${len}/2000` : 'Enter 发送 · Shift+Enter 换行';
}
$('message').addEventListener('input', autoGrow);
$('message').addEventListener('keydown', event => {
  if (event.key === 'Enter' && !event.shiftKey && !event.isComposing && event.keyCode !== 229) {
    event.preventDefault();
    $('compose').requestSubmit();
  }
});

$('copy-chat').onclick = () => {
  if (!data?.turns?.length) return;
  const row = sessionRow();
  const out = [`# ${data.agent.name}${row ? ' · ' + row.title : ''}`, ''];
  for (const t of data.turns) {
    out.push('### 主人', '', t.message || '', '', `### ${data.agent.name}`, '',
      t.result || t.failure?.detail || labels[t.status] || t.status, '');
  }
  copyText(out.join('\n').trim() + '\n', $('copy-chat'), '复制对话');
};

function draw() {
  const row = sessionRow();
  const list = data?.sessions || [];
  $('topic').textContent = row ? `${data.agent.name} · ${row.title}` : data ? data.agent.name : '选择一位伙伴';
  $('topic').title = $('topic').textContent;

  const sessionKey = JSON.stringify([list, session, busy]);
  if (sessionKey !== sessionSignature) {
    sessionSignature = sessionKey;
    const active = list.filter(i => i.status !== 'archived');
    const archived = list.filter(i => i.status === 'archived');
    const makeGroup = (title, items) => {
      if (!items.length) return [];
      const head = el('div', 'group-label');
      head.append(el('span', '', title), el('span', '', String(items.length)));
      return [head, ...items.map(item => {
        const b = el('button', 'sess-item' + (item.status === 'archived' ? ' archived' : ''));
        b.type = 'button';
        b.setAttribute('aria-current', String(item.id === session));
        b.disabled = busy;
        b.append(el('span', 'sess-title', item.title));
        if (item.status === 'archived') b.append(el('span', 'sess-badge', '已归档'));
        b.onclick = () => {
          if (window.innerWidth <= 860) setCollapsed(true, false);
          item.status === 'archived' ? openSession(item.id) : void change('select', {session:item.id});
        };
        return b;
      })];
    };
    const nodes = [...makeGroup('对话', active), ...makeGroup('已归档', archived)];
    $('sessions').replaceChildren(...(nodes.length ? nodes : [el('div', 'empty-list', '暂无对话，点击上方新建')]));
  }

  const turns = data?.turns || [];
  const key = JSON.stringify([agent, session, turns]);
  if (key !== turnSignature) {
    const feed = $('turns'), track = $('track');
    const follow = !turnSignature || caughtUp();
    const pos = feed.scrollTop;
    turnSignature = key;
    if (!turns.length) {
      const empty = el('div', 'empty-stage');
      empty.append(
        svgIcon([['path',{d:'M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z'}]]),
        el('strong', '', row ? `和 ${data.agent.name} 开始对话` : '选择或新建一段对话'),
        el('p', '', '你在直聊中的对话与伙伴记忆独立归档，不写入大肥鱼的 QQ 记录。')
      );
      track.replaceChildren(empty);
    } else {
      const name = data.agent.name;
      const hue = String(avatarHue(name));
      track.replaceChildren(...turns.flatMap(turn => {
        const when = turn.created ? fmtTime.format(turn.created * 1000) : '';
        const sent = el('article', 'msg owner');
        const bub = el('div', 'bubble');
        bub.append(renderMarkdown(turn.message || ''));
        const smeta = el('div', 'owner-meta');
        const scopy = el('button', 'mini-btn'); scopy.type = 'button'; scopy.append(COPY_SVG(), el('span', '', '复制'));
        scopy.onclick = () => copyText(turn.message || '', scopy, '复制');
        const sacts = el('span', 'msg-actions'); sacts.append(scopy);
        smeta.append(sacts);
        if (when) smeta.append(el('span', 'msg-time', when));
        sent.append(bub, smeta);

        const reply = el('article', 'msg assistant');
        const head = el('div', 'msg-head');
        const av = el('span', 'avatar', Array.from(name)[0] || '?');
        av.style.setProperty('--av-h', hue);
        head.append(av, el('span', 'speaker', name));
        if (when) head.append(el('span', 'msg-time', when));
        const body = el('div', 'msg-body');
        if (turn.result) {
          const rcopy = el('button', 'mini-btn'); rcopy.type = 'button'; rcopy.append(COPY_SVG(), el('span', '', '复制'));
          rcopy.onclick = () => copyText(turn.result, rcopy, '复制');
          const racts = el('span', 'msg-actions'); racts.append(rcopy);
          head.append(racts);
          body.append(renderMarkdown(turn.result));
        } else if (activeStates.has(turn.status)) {
          const st = el('div', 'status-row');
          st.append(el('span', 'dot live'), el('span', '', labels[turn.status] || turn.status));
          body.append(st);
        } else {
          body.append(renderMarkdown(turn.failure?.detail || labels[turn.status] || turn.status));
        }
        if (turn.memory_saved?.length) body.append(el('div', 'mem-chip', '已保存至伙伴记忆 · ' + turn.memory_saved.join('、')));
        else if (turn.memory_error) body.append(el('div', 'mem-chip warn', '这轮记忆写入未确认'));
        reply.append(head, body);
        return [sent, reply];
      }));
    }
    if (follow) { feed.scrollTop = feed.scrollHeight; $('follow').hidden = true; }
    else { feed.scrollTop = pos; $('follow').hidden = false; }
  }
  controls();
}

function openSession(id) {
  session = id;
  turnSignature = '';
  void refresh();
}
async function refresh() {
  const token = ++reading;
  try {
    const roster = await api();
    if (token !== reading) return;
    if (group && group !== roster.group) { agent = ''; session = ''; pending = null; $('message').value = ''; autoGrow(); }
    group = roster.group;
    ready = roster.ready;
    const list = roster.agents;
    if (!list.some(row => row.id === agent)) {
      agent = list.find(row => row.status === 'active')?.id || list[0]?.id || '';
      session = '';
    }
    const key = JSON.stringify([agent, list]);
    if (key !== agentSignature) {
      agentSignature = key;
      $('agent').replaceChildren(...list.map(row => Object.assign(
        el('option', '', row.name + (row.status === 'archived' ? ' · 已归档' : row.status === 'paused' ? ' · 已暂停' : '')),
        {value: row.id})));
      $('agent').value = agent;
      $('agent').disabled = !list.length;
    }
    $('ready-dot').className = 'dot ' + (ready ? 'ok' : 'warn');
    $('group').textContent = (group === 'test' ? '测试名册' : '正式名册') + (ready ? ' · 已就绪' : ' · 等待受托 DSH');
    const detail = agent ? await api({agent, ...(session && {session})}) : null;
    if (token !== reading) return;
    data = detail;
    session = data?.session || '';
    draw();
  } catch (error) {
    if (token !== reading) return;
    ready = false;
    $('ready-dot').className = 'dot warn';
    controls();
    setStatus(error.message, true);
  }
}
async function change(action, fields) {
  if (busy || !agent) return;
  busy = true; controls();
  const target = agent;
  const body = {action, agent:target, group, ...fields};
  try {
    const result = await api({}, body);
    setStatus(action === 'send' ? '已交给伙伴' : '', false);
    if (action === 'send') { $('message').value = ''; autoGrow(); pending = null; }
    if (action === 'new') $('title').value = '';
    if (agent === target && ['new', 'select'].includes(action)) { session = result.id; turnSignature = ''; }
    await refresh();
  } catch (error) {
    setStatus(error.message, true);
  } finally {
    busy = false;
    draw();
  }
}
$('agent').onchange = () => {
  agent = $('agent').value; session = ''; data = null; turnSignature = '';
  $('message').value = ''; autoGrow(); pending = null; draw(); void refresh();
};
$('new').onsubmit = event => { event.preventDefault(); void change('new', {title: $('title').value}); };
$('archive').onclick = () => void change(sessionRow()?.status === 'archived' ? 'select' : 'archive', {session});
$('compose').onsubmit = event => {
  event.preventDefault();
  if ($('send').disabled) return;
  const text = $('message').value.trim(), key = JSON.stringify([agent, session, text]);
  if (!text) return;
  if (pending?.key !== key) pending = {key, id: crypto.randomUUID().replaceAll('-', '')};
  void change('send', {session, text, request_id: pending.id});
};
(async function poll() { await refresh(); setTimeout(poll, 2600); })();
